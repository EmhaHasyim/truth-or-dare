<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fae9d8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d232a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Truth or Dare" />
    <meta name="description" content="Main Truth or Dare online! Game seru buat bareng teman." />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="icon" href="/favicon.ico" />
    <title>Truth or Dare</title>
    <script>
      // Restore the saved theme before first paint to avoid a flash of the
      // wrong theme. Mirrors the write in src/routes/__root.tsx (ThemeToggle).
      try {
        var savedTheme = localStorage.getItem('theme')
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
